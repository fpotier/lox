name: go
on:
  push:
    branches:
      - master
    paths:
      - go/**
      - test/**
      - .devcontainer/**
      - .github/workflows/**
  pull_request:
    paths:
      - go/**
      - test/**
      - .devcontainer/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}-devcontainer

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          runCmd: |
            set -euo pipefail
            cd go
            go generate ./...
            go tool actionlint -color
            golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: filter
          refFilterForPush: refs/heads/master
          eventFilterForPush: push
          runCmd: |
            set -euo pipefail
            cd go
            go mod tidy -diff
            go generate ./...
            for toolchain in local "go$GO_OLDSTABLE"; do
              echo "::group::$(GOTOOLCHAIN=$toolchain go version)"
              GOTOOLCHAIN="$toolchain" go test -v ./...
              echo "::endgroup::"
            done
