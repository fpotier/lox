name: go
on:
  push:
    branches:
      - master
    paths:
      - go/**
      - test/**
      - .github/workflows/**
  pull_request:
    paths:
      - go/**
      - test/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: oldstable
          cache-dependency-path: go/go.sum
      - run: go generate ./...
        working-directory: go
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: go

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go: [oldstable, stable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go mod tidy -diff
      - run: go generate ./...
      - run: go test -v ./...
