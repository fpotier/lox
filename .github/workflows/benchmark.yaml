name: benchmark
on:
  pull_request:
    paths:
      - go/**
      - benchmark/**
      - .devcontainer/**
      - .github/workflows/benchmark.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}-devcontainer

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench-base
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          runCmd: |
            set -euo pipefail
            bench() {
              (cd "$1" && go generate ./... && go test ./cmd/glox -run='^$' -bench=. -count=6 -timeout=30m)
            }
            bench .bench-base/go > base.txt
            bench go > head.txt
            (cd go && go tool benchstat base=../base.txt pr=../head.txt) > benchstat.txt
      - name: Publish comparison
        run: |
          {
            echo '```'
            cat benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
