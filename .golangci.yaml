version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    - cyclop
    - depguard
    - exhaustive
    - exhaustruct # deprecated, replaced by exhaustruct_v5
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - godoclint
    - godot
    - godox
    - gomodguard # deprecated, replaced by gomodguard_v2
    - iface
    - interfacebloat
    - ireturn
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
